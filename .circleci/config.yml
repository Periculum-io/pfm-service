version: 2.1

orbs:
  aws-s3: circleci/aws-cli@3.1.1
  aws-ecr: circleci/aws-ecr@7.3.0

jobs:
  tf-plan:
    parameters:
      environment:
        type: string
        default: "dev"
    docker:
      - image: hashicorp/terraform:1.2.8
    steps:
      - checkout
      - run:
          name: terraform init & plan
          command: |
            cd ops/terraform/env/<< parameters.environment >>
            terraform init -input=false
            terraform plan -out tf-apply-<< parameters.environment >> -lock-timeout=180s
      - persist_to_workspace:
          root: .
          paths:
            - .

  tf-apply:
    parameters:
      environment:
        type: string
        default: "dev"
    docker:
      - image: hashicorp/terraform:1.2.8
    steps:
      - attach_workspace:
          at: .
      - run:
          name: terraform apply
          command: |
            cd ops/terraform/env/<< parameters.environment >>
            terraform apply -lock-timeout=180s -auto-approve tf-apply-<< parameters.environment >>

  pull-latest-and-restart-pfm-flask-api:
    parameters:
      environment:
        type: string
        default: "dev"
    docker:
      - image: hashicorp/terraform:1.2.8
    steps:
      - attach_workspace:
          at: .
      - run:
          name: pull latest and restart pfm flask api vm 1
          command: | 
            sleep 180s
            cd ops/terraform/env/<< parameters.environment >>
            instance_dns=$(terraform output -raw instance_1_host_address)
            github_username=$(terraform output -raw github_username)
            github_personal_access_token=$(terraform output -raw github_personal_access_token)
            terraform output -raw ec2_ssh_private_key > pfm_private_key.pem
            chmod 400 pfm_private_key.pem
            ssh -i "pfm_private_key.pem" -o StrictHostKeyChecking=no ubuntu@$instance_dns bash -c '\
              cd ~
              cd periculum-pfm
              git config --global --add safe.directory /home/ubuntu/periculum-pfm
              git config --global credential.helper store
              git config --global user.name $github_username
              git config --global user.password $github_personal_access_token
              git checkout main
              git reset --hard
              git pull
              cd pfm-api
              pip3 install -e .
              cd flask-api
              pip install -r requirements.txt
              sudo systemctl restart pfm-api
              sudo systemctl start pfm-api
              sudo systemctl enable pfm-api'

workflows:
  cicd:
    jobs:
      - tf-plan:
          filters:
            branches:
              only:
                - main
          name: tf-plan-dev
          environment: dev
          context: circleci
      - tf-apply:
          filters:
            branches:
              only:
                - main
          name: tf-apply-dev
          environment: dev
          context: circleci
          requires:
            - tf-plan-dev
      - pull-latest-and-restart-pfm-flask-api:
          filters:
            branches:
              only:
                - main
          name: pull-latest-and-restart-pfm-flask-api-dev
          environment: dev
          context: circleci
          requires:
            - tf-apply-apply
      #
      # TODO: Run tests to validate DEV env here
      #
      
      - tf-plan:
          filters:
            branches:
              only:
                - main
          name: tf-plan-staging
          environment: stg
          context: terraform
          requires:
            - tf-apply-dev
      - tf-apply:
          filters:
            branches:
              only:
                - main
          name: tf-apply-staging
          environment: stg
          context: terraform
          requires:
            - tf-plan-staging
      - pull-latest-and-restart-pfm-flask-api:
          filters:
            branches:
              only:
                - main
          name: pull-latest-and-restart-pfm-flask-api-staging
          environment: stg
          context: circleci
          requires:
            - tf-apply-staging
      #
      # TODO: Run tests to validate STAGING env here
      #

      - tf-plan:
          filters:
            branches:
              only:
                - main
          name: tf-plan-production
          environment: prod
          context: circleci
          requires:
            - tf-apply-staging
      - hold:
          filters:
            branches:
              only:
                - main
          name: deploy-prod-approval
          type: approval
          requires:
            - tf-plan-production
      - tf-apply:
          filters:
            branches:
              only:
                - main
          name: tf-apply-production
          environment: prod
          context: circleci
          requires:
            - tf-plan-production
            - deploy-prod-approval
      - pull-latest-and-restart-pfm-flask-api:
          filters:
            branches:
              only:
                - main
          name: pull-latest-and-restart-pfm-flask-api-prod
          environment: prod
          context: circleci
          requires:
            - tf-apply-production